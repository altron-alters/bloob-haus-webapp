# Bloob Haus Site Config — alter-engineers
# Infrastructure settings only. Author settings live in _bloob-settings.md in the vault.

site:
  url: "https://alterengineers.com"

content:
  repo: "altron-alters/website-content"
  branch: "master"
  exclude_files:
    - "README.md"

features:
  search: true
  og_images: true
  magic_machines: false
  embed: false
  # Pages load only the visualizer CSS/JS they actually use.
  # Licensed by a clean `node scripts/audit-visualizer-detection.js
  # --src=src-alterengineers` run on 2026-07-28 (7/7 detection signatures safe,
  # covering 86/86 pages). Re-run that audit after adding a shape to the theme
  # or changing a shape's detect selectors — a wrong guess silently strips
  # styling from a live page.
  per_page_visualizers: true

graph:
  extra_fields:
    project-profile:
      - building_type
      - construction_type
      - location
      - sqft
      - services
      - target
      - tags
